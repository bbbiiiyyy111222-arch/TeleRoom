<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonGrief-Forum 🌙 Технические работы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: radial-gradient(circle at 30% 40%, #0a0a1a, #1a1a3a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Анимированные звезды */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 10% 20%, white, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 30% 50%, white, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50% 80%, white, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 70% 30%, white, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90% 60%, white, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 20% 70%, #b0b0ff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 60% 15%, #b0b0ff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 85% 85%, #b0b0ff, rgba(0,0,0,0));
            background-repeat: no-repeat;
            background-size: 200px 200px;
            animation: starsMove 20s linear infinite;
            opacity: 0.7;
        }

        @keyframes starsMove {
            from { background-position: 0% 0%; }
            to { background-position: 200% 200%; }
        }

        /* Луна */
        .moon {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 80px;
            filter: drop-shadow(0 0 20px #7a7aff);
            animation: moonFloat 4s ease-in-out infinite;
        }

        @keyframes moonFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* Контейнер */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 50px;
            background: rgba(26, 26, 58, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 60px;
            border: 3px solid #7a7aff;
            box-shadow: 0 0 100px rgba(122, 122, 255, 0.5);
            max-width: 600px;
            width: 90%;
            animation: containerGlow 3s infinite;
        }

        @keyframes containerGlow {
            0%, 100% { box-shadow: 0 0 50px rgba(122, 122, 255, 0.4); border-color: #7a7aff; }
            50% { box-shadow: 0 0 100px rgba(176, 176, 255, 0.8); border-color: #b0b0ff; }
        }

        /* Иконка шестеренки */
        .gear-icon {
            font-size: 80px;
            display: inline-block;
            animation: gearSpin 4s linear infinite;
            filter: drop-shadow(0 0 20px #ffaa44);
        }

        @keyframes gearSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Заголовок */
        h1 {
            color: #ffaa44;
            font-size: 28px;
            margin: 20px 0;
            text-shadow: 0 0 20px #ffaa44, 0 0 40px #ff8844;
            letter-spacing: 2px;
        }

        /* Подзаголовок */
        .subtitle {
            color: #b0b0ff;
            font-size: 12px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        /* Прогресс-бар */
        .progress-bar {
            width: 80%;
            height: 20px;
            background: #2a2a4a;
            border-radius: 30px;
            margin: 30px auto;
            overflow: hidden;
            border: 2px solid #4a4a8a;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffaa44, #ff6644, #ffaa44);
            border-radius: 30px;
            animation: progress 8s ease-in-out infinite;
            box-shadow: 0 0 15px #ffaa44;
        }

        @keyframes progress {
            0% { width: 0%; }
            20% { width: 15%; }
            40% { width: 35%; }
            60% { width: 55%; }
            80% { width: 75%; }
            100% { width: 0%; }
        }

        /* Текст статуса */
        .status-text {
            color: #c0c0ff;
            font-size: 11px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #ffaa44;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Кнопка обновления */
        .refresh-btn {
            background: linear-gradient(135deg, #4a4a8a, #6a6aaa);
            border: 2px solid #b0b0ff;
            color: white;
            padding: 12px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(122, 122, 255, 0.5);
        }

        .refresh-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px #7a7aff;
            background: linear-gradient(135deg, #5a5a9a, #7a7aff);
        }

        /* Список работ */
        .work-list {
            text-align: left;
            margin: 25px 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
        }

        .work-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(122, 122, 255, 0.2);
            color: #d0d0ff;
            font-size: 10px;
        }

        .work-item:last-child {
            border-bottom: none;
        }

        .work-check {
            width: 20px;
            height: 20px;
            background: #4a4a8a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            animation: checkPulse 2s infinite;
        }

        @keyframes checkPulse {
            0%, 100% { background: #4a4a8a; }
            50% { background: #7a7aff; }
        }

        /* Таймер */
        .timer {
            font-size: 24px;
            color: #ffaa44;
            margin: 20px 0;
            text-shadow: 0 0 10px #ffaa44;
        }

        /* Социальные ссылки */
        .social-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .social-link {
            color: #b0b0ff;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.3s;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2a2a4a;
            border-radius: 50%;
            border: 2px solid #4a4a8a;
        }

        .social-link:hover {
            transform: translateY(-5px);
            border-color: #ffaa44;
            color: #ffaa44;
            box-shadow: 0 0 20px #ffaa44;
        }
    </style>
</head>
<body>
    <div class="moon">🌙</div>
    
    <div class="container">
        <div class="gear-icon">⚙️</div>
        
        <h1>ТЕХНИЧЕСКИЕ РАБОТЫ</h1>
        <div class="subtitle">САЙТ ВРЕМЕННО НЕДОСТУПЕН</div>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <div class="status-text">
            <span class="status-dot"></span>
            <span>ИДУТ РАБОТЫ ПО УЛУЧШЕНИЮ СЕРВЕРА</span>
            <span class="status-dot"></span>
        </div>
        
        <div class="timer" id="timer">--:--:--</div>
        
        <div class="work-list">
            <div class="work-item">
                <div class="work-check">⚙️</div>
                <span>Обновление серверного ПО</span>
            </div>
            <div class="work-item">
                <div class="work-check">⚙️</div>
                <span>Оптимизация базы данных</span>
            </div>
            <div class="work-item">
                <div class="work-check">⚙️</div>
                <span>Улучшение защиты от DDoS</span>
            </div>
            <div class="work-item">
                <div class="work-check">⚙️</div>
                <span>Добавление новых функций</span>
            </div>
        </div>
        
        <div class="social-links">
            <a href="https://t.me/milo4ika1" target="_blank" class="social-link" title="Telegram">📱</a>
            <a href="#" class="social-link" title="Discord">💬</a>
            <a href="#" class="social-link" title="VK">📘</a>
        </div>
        
        <button class="refresh-btn" onclick="checkSite()">
            <span>🔄</span> ПРОВЕРИТЬ СТАТУС
        </button>
    </div>

    <script>
        // Таймер обратного отсчета (примерное время до завершения)
        let seconds = 3600; // 1 час
        const timerElement = document.getElementById('timer');
        
        function updateTimer() {
            if(seconds > 0) {
                seconds--;
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const secs = seconds % 60;
                timerElement.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                setTimeout(updateTimer, 1000);
            } else {
                timerElement.textContent = '00:00:00';
            }
        }
        
        updateTimer();
        
        // Проверка статуса
        function checkSite() {
            const btn = document.querySelector('.refresh-btn');
            btn.textContent = '🔄 ПРОВЕРКА...';
            btn.disabled = true;
            
            setTimeout(() => {
                const status = document.querySelector('.status-text');
                const originalHtml = status.innerHTML;
                status.innerHTML = '<span class="status-dot"></span><span>✅ РАБОТЫ ЗАВЕРШАЮТСЯ...</span><span class="status-dot"></span>';
                
                setTimeout(() => {
                    status.innerHTML = originalHtml;
                    btn.textContent = '🔄 ПРОВЕРИТЬ СТАТУС';
                    btn.disabled = false;
                }, 3000);
            }, 1500);
        }
    </script>
</body>
</html>

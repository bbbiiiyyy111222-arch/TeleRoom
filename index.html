<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonGrief-Forum 🌙 Технические работы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: radial-gradient(circle at 30% 40%, #0a0a1a, #1a1a3a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Анимированные звезды */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 10% 20%, white, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 30% 50%, white, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50% 80%, white, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 70% 30%, white, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90% 60%, white, rgba(0,0,0,0));
            background-repeat: no-repeat;
            background-size: 200px 200px;
            animation: starsMove 20s linear infinite;
            opacity: 0.5;
        }

        @keyframes starsMove {
            from { background-position: 0% 0%; }
            to { background-position: 200% 200%; }
        }

        /* Луна */
        .moon {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 70px;
            filter: drop-shadow(0 0 20px #7a7aff);
            animation: moonFloat 4s ease-in-out infinite;
        }

        @keyframes moonFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* Контейнер */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 50px 40px;
            background: rgba(26, 26, 58, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 60px;
            border: 3px solid #7a7aff;
            box-shadow: 0 0 100px rgba(122, 122, 255, 0.5);
            max-width: 550px;
            width: 90%;
            animation: containerGlow 3s infinite;
        }

        @keyframes containerGlow {
            0%, 100% { box-shadow: 0 0 50px rgba(122, 122, 255, 0.4); border-color: #7a7aff; }
            50% { box-shadow: 0 0 100px rgba(176, 176, 255, 0.8); border-color: #b0b0ff; }
        }

        /* Шестеренка */
        .gear {
            font-size: 70px;
            display: inline-block;
            animation: gearSpin 4s linear infinite;
            filter: drop-shadow(0 0 20px #ffaa44);
        }

        @keyframes gearSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Заголовок */
        h1 {
            color: #ffaa44;
            font-size: 24px;
            margin: 20px 0 15px;
            text-shadow: 0 0 20px #ffaa44;
            letter-spacing: 2px;
        }

        /* Подзаголовок */
        .subtitle {
            color: #b0b0ff;
            font-size: 11px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        /* Прогресс-бар */
        .progress-bar {
            width: 80%;
            height: 15px;
            background: #2a2a4a;
            border-radius: 30px;
            margin: 25px auto;
            overflow: hidden;
            border: 2px solid #4a4a8a;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffaa44, #ff6644);
            border-radius: 30px;
            animation: progress 6s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 0%; }
            20% { width: 20%; }
            40% { width: 40%; }
            60% { width: 60%; }
            80% { width: 80%; }
            100% { width: 0%; }
        }

        /* Текст статуса */
        .status-text {
            color: #c0c0ff;
            font-size: 10px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #ffaa44;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Список работ */
        .work-list {
            text-align: left;
            margin: 25px 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
        }

        .work-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(122, 122, 255, 0.2);
            color: #d0d0ff;
            font-size: 9px;
        }

        .work-item:last-child {
            border-bottom: none;
        }

        /* Кнопки */
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 25px 0 15px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #4a4a8a, #6a6aaa);
            border: 2px solid #b0b0ff;
            color: white;
            padding: 12px 25px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px #7a7aff;
            background: linear-gradient(135deg, #5a5a9a, #7a7aff);
        }

        .btn-telegram {
            background: linear-gradient(135deg, #0088cc, #00aaff);
            border-color: #88ccff;
        }

        .btn-telegram:hover {
            box-shadow: 0 10px 30px #0088cc;
        }

        /* Ссылка на Telegram */
        .telegram-link {
            display: inline-block;
            background: #0088cc;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 10px;
            margin-top: 10px;
            transition: all 0.3s;
            border: 2px solid #88ccff;
        }

        .telegram-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px #0088cc;
        }

        /* Обратный отсчет */
        .countdown {
            color: #ffaa44;
            font-size: 12px;
            margin-top: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            display: inline-block;
            width: auto;
        }
    </style>
</head>
<body>
    <div class="moon">🌙</div>
    
    <div class="container">
        <div class="gear">⚙️</div>
        
        <h1>ТЕХНИЧЕСКИЕ РАБОТЫ</h1>
        <div class="subtitle">САЙТ ВРЕМЕННО НЕДОСТУПЕН</div>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <div class="status-text">
            <span class="status-dot"></span>
            <span>ИДУТ РАБОТЫ ПО УЛУЧШЕНИЮ</span>
            <span class="status-dot"></span>
        </div>
        
        <div class="work-list">
            <div class="work-item">
                <div>🔧</div>
                <span>Обновление серверного ПО</span>
            </div>
            <div class="work-item">
                <div>🔧</div>
                <span>Оптимизация базы данных</span>
            </div>
            <div class="work-item">
                <div>🔧</div>
                <span>Улучшение защиты</span>
            </div>
            <div class="work-item">
                <div>🔧</div>
                <span>Добавление новых функций</span>
            </div>
        </div>
        
        <div class="countdown" id="countdown">
            ⏳ ОРИЕНТИРОВОЧНОЕ ВРЕМЯ: 1 ЧАС
        </div>
        
        <div class="buttons">
            <button class="btn" onclick="refreshSite()">
                <span>🔄</span> ОБНОВИТЬ
            </button>
            <a href="https://t.me/milo4ika1" target="_blank" class="btn btn-telegram">
                <span>📱</span> НАПИСАТЬ КУРАТОРУ
            </a>
        </div>
        
        <div class="telegram-link" onclick="copyTelegram()">
            📋 @milo4ika1 (скопировать)
        </div>
    </div>

    <script>
        // Функция обновления страницы
        function refreshSite() {
            location.reload();
        }
        
        // Функция копирования Telegram
        function copyTelegram() {
            navigator.clipboard.writeText('@milo4ika1').then(() => {
                const el = document.querySelector('.telegram-link');
                const originalText = el.innerHTML;
                el.innerHTML = '✅ СКОПИРОВАНО!';
                setTimeout(() => {
                    el.innerHTML = originalText;
                }, 2000);
            });
        }
        
        // Проверка каждые 30 секунд (опционально)
        setInterval(() => {
            // Можно добавить проверку статуса
            console.log('Проверка статуса...');
        }, 30000);
    </script>
</body>
</html>

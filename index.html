<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MoonGrief-Forum 🌙 Технические работы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: radial-gradient(circle at 20% 30%, #0a0a1a, #1a1a3a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Звёздный фон */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 10% 20%, white, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 30% 50%, white, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50% 80%, white, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 70% 30%, white, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90% 60%, white, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 15% 85%, #b0b0ff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 45% 15%, #b0b0ff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 75% 55%, #b0b0ff, rgba(0,0,0,0)),
                radial-gradient(4px 4px at 85% 25%, #ffaa44, rgba(0,0,0,0)),
                radial-gradient(4px 4px at 25% 75%, #ffaa44, rgba(0,0,0,0));
            background-repeat: no-repeat;
            background-size: 300px 300px;
            animation: starsMove 12s linear infinite;
            opacity: 0.8;
        }

        @keyframes starsMove {
            from { background-position: 0% 0%; }
            to { background-position: 200% 200%; }
        }

        /* Луна */
        .moon {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 90px;
            filter: drop-shadow(0 0 30px #7a7aff);
            animation: moonFly 6s ease-in-out infinite;
            cursor: pointer;
            z-index: 20;
        }

        @keyframes moonFly {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-20px, -30px) rotate(10deg); }
            50% { transform: translate(10px, -50px) rotate(-5deg); }
            75% { transform: translate(-10px, -20px) rotate(8deg); }
        }

        /* Парящие блоки */
        .floating-block {
            position: absolute;
            font-size: 40px;
            opacity: 0.4;
            pointer-events: none;
            animation: floatBlock 15s infinite linear;
            z-index: 0;
        }

        @keyframes floatBlock {
            0% { transform: translateX(-100px) translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateX(calc(100vw + 100px)) translateY(100px) rotate(360deg); opacity: 0; }
        }

        /* Контейнер */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 30px;
            background: rgba(26, 26, 58, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            border: 3px solid #7a7aff;
            box-shadow: 0 0 100px rgba(122, 122, 255, 0.6);
            max-width: 550px;
            width: 90%;
            animation: containerPulse 2s infinite;
        }

        @keyframes containerPulse {
            0%, 100% { box-shadow: 0 0 50px rgba(122, 122, 255, 0.4); border-color: #7a7aff; }
            50% { box-shadow: 0 0 120px rgba(176, 176, 255, 0.9); border-color: #ffaa44; }
        }

        /* Шестерёнка */
        .gear {
            font-size: 80px;
            display: inline-block;
            animation: gearSpin 3s linear infinite;
            filter: drop-shadow(0 0 25px #ffaa44);
        }

        @keyframes gearSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Заголовки */
        h1 {
            color: #ffaa44;
            font-size: 22px;
            margin: 20px 0 15px;
            text-shadow: 0 0 20px #ffaa44, 0 0 40px #ff6644;
            letter-spacing: 2px;
            animation: textGlow 1.5s infinite;
        }

        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 20px #ffaa44; }
            50% { text-shadow: 0 0 40px #ff6644, 0 0 60px #ffaa44; }
        }

        .subtitle {
            color: #b0b0ff;
            font-size: 10px;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        /* Прогресс-бар */
        .progress-bar {
            width: 90%;
            height: 12px;
            background: #2a2a4a;
            border-radius: 30px;
            margin: 20px auto;
            overflow: hidden;
            border: 2px solid #4a4a8a;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffaa44, #ff6644, #ffaa44);
            border-radius: 30px;
            animation: progress 4s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 0%; }
            25% { width: 30%; }
            50% { width: 60%; }
            75% { width: 85%; }
            100% { width: 0%; }
        }

        /* Статус */
        .status-text {
            color: #c0c0ff;
            font-size: 9px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #ffaa44;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.5); }
        }

        /* Telegram блок */
        .telegram-box {
            background: linear-gradient(135deg, #1a1a4a, #2a2a6a);
            border: 2px solid #7a7aff;
            border-radius: 50px;
            padding: 12px 20px;
            margin: 20px auto;
            display: inline-block;
            cursor: pointer;
            transition: all 0.3s;
            animation: telegramPulse 2s infinite;
        }

        @keyframes telegramPulse {
            0%, 100% { box-shadow: 0 0 10px #7a7aff; }
            50% { box-shadow: 0 0 30px #7a7aff; }
        }

        .telegram-box:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #2a2a6a, #3a3a8a);
        }

        .telegram-name {
            color: #b0b0ff;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .telegram-name span:first-child {
            font-size: 24px;
        }

        .copy-notify {
            font-size: 8px;
            color: #ffaa44;
            margin-top: 5px;
        }

        /* Кнопки */
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #4a4a8a, #6a6aaa);
            border: 2px solid #b0b0ff;
            color: white;
            padding: 10px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px #7a7aff;
            background: linear-gradient(135deg, #5a5a9a, #7a7aff);
        }
    </style>
</head>
<body>
    <!-- ЛЕТАЮЩАЯ ЛУНА -->
    <div class="moon">🌙</div>

    <!-- ПАРЯЩИЕ БЛОКИ -->
    <div class="floating-block" style="top: 10%; left: -50px; animation-duration: 12s;">🔷</div>
    <div class="floating-block" style="top: 30%; left: -80px; animation-duration: 18s;">🔶</div>
    <div class="floating-block" style="top: 60%; left: -40px; animation-duration: 15s;">⭐</div>
    <div class="floating-block" style="top: 80%; left: -100px; animation-duration: 20s;">🌙</div>
    <div class="floating-block" style="top: 15%; right: -60px; animation-duration: 14s;">🕹️</div>
    <div class="floating-block" style="top: 45%; right: -90px; animation-duration: 22s;">🎮</div>
    <div class="floating-block" style="top: 70%; right: -50px; animation-duration: 16s;">⚙️</div>

    <div class="container">
        <div class="gear">⚙️</div>
        
        <h1>ТЕХНИЧЕСКИЕ РАБОТЫ</h1>
        <div class="subtitle">САЙТ ВРЕМЕННО НЕДОСТУПЕН</div>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <div class="status-text">
            <span class="status-dot"></span>
            <span>ИДУТ РАБОТЫ ПО УЛУЧШЕНИЮ</span>
            <span class="status-dot"></span>
        </div>
        
        <!-- ТВОЙ TELEGRAM -->
        <div class="telegram-box" onclick="copyTelegram()">
            <div class="telegram-name">
                <span>📱</span>
                <span>@milo4ika1</span>
                <span>👑</span>
            </div>
            <div class="copy-notify">📋 НАЖМИТЕ ЧТОБЫ СКОПИРОВАТЬ</div>
        </div>
        
        <div class="buttons">
            <button class="btn" onclick="refreshSite()">
                <span>🔄</span> ОБНОВИТЬ
            </button>
        </div>
        
        <div class="status-text">
            <span>⚠️ ФОРУМ МОЖЕТ ЗАКРЫТЬСЯ НАВСЕГДА ⚠️</span>
        </div>
    </div>

    <script>
        // Копирование Telegram
        function copyTelegram() {
            navigator.clipboard.writeText('@milo4ika1').then(() => {
                const box = document.querySelector('.telegram-box');
                const original = box.innerHTML;
                box.innerHTML = '<div class="telegram-name"><span>✅</span><span>СКОПИРОВАНО!</span><span>📋</span></div><div class="copy-notify">@milo4ika1</div>';
                setTimeout(() => {
                    box.innerHTML = original;
                }, 2000);
            });
        }

        // Обновление страницы
        function refreshSite() {
            location.reload();
        }
    </script>
</body>
</html>
